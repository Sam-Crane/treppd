[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/onboarding",
  "http://localhost:3000/reset-password",
  "http://localhost:3000/dashboard",
]

[auth.email]
enable_signup = true
enable_confirmations = true

# Inject admin_role into the access-token JWT (see migration
# 20260520000010_admin_role_jwt_hook.sql). On hosted Supabase, also enable this
# under Dashboard → Authentication → Hooks.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"
